"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"cad:f45\" rows=\"2\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O que não pode faltar no encerramento?</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"cad:f46\" rows=\"2\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p><p style=\"margin-top:10.9px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Fonte: <a class=\"hot\" data-refs=\"mdsap-docs\">MDSAP AU P0027.007</a>; <a class=\"hot\" data-refs=\"mdsap-docs\">MDSAP AU P0002.011</a>, Outsourcing e Re-audit; <a class=\"hot\" data-refs=\"mdsap-docs\">MDSAP AU P0037.001</a></span></p>", "refs": ["mdsap-docs"]}, {"id": "s13", "kicker": "AVALIAÇÃO FINAL", "title": "Avaliação final: 40 questões", "ex": null, "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">AVALIAÇÃO FINAL</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação final: 40 questões</span></p><p style=\"margin-top:0.0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Individual, 20 minutos, sem consulta. Marque uma alternativa por questão. A prova cobre os seis módulos do curso.</span></p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O MDSAP permite que uma única auditoria atenda:</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas o país de fabricação</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">As autoridades regulatórias participantes do programa</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente a <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a></span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas requisitos de exportação</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A abordagem de auditoria do MDSAP é organizada em:</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Capítulos da <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a></span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Processos e tarefas</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Departamentos da empresa</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Países</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O primeiro processo da sequência de auditoria é:</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Compras</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Gestão</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Projeto e Desenvolvimento</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Produção e Controle de Serviço</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O campo que indica o requisito de cada jurisdição em uma tarefa é:</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Links</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Clause and Regulation</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Assessing conformity</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Annex</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Quando um requisito regulatório se liga a uma cláusula mais específica da <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485:2016</a>, o achado cita:</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A cláusula 4.2.1</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A cláusula mais específica</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas o regulamento do país</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">As duas, sem distinção</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Dentro de um processo, as tarefas podem ser auditadas:</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente na ordem numérica</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em qualquer ordem, para eficiência e eficácia</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em ordem alfabética</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A critério do auditado</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">As linkages indicadas nas tarefas servem para:</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Cumprir exigência de formato</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Lembrar a equipe das interações entre processos e orientar a seleção de amostra</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Numerar as tarefas</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Substituir o plano de auditoria</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A regulamentação de boas práticas de fabricação citada para o Brasil no <a class=\"hot\" data-refs=\"mdsap-docs\">P0002.011</a> revisão 011 é:</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC 16/2013</a></span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC ANVISA 665/2022</a></span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC 185/2001</a></span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa-legis\">RDC 36/2015</a></span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">9. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A regulamentação de sistema de gestão da qualidade dos Estados Unidos citada na revisão 011 é:</span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"cfr-803\">21 CFR 803</a></span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"cfr-820\">21 CFR 820</a></span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"cfr-806\">21 CFR 806</a></span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"cfr-807\">21 CFR 807</a></span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">10. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A ordenança japonesa de requisitos de SGQ referida pelo programa é:</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"pmda\">MHLW</a> <a class=\"hot\" data-refs=\"pmda\">MO 169</a></span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"pmda\">MHLW</a> MO 114</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"pmda\">PMDA</a> 2014</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">JIS Q 13485</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">11. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">No Canadá, os requisitos de SGQ auditados vêm das:</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Food and Drugs Act apenas</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Medical Devices Regulations</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">CMDCAS Guidelines</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> somente</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">12. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Na Austrália, os requisitos de SGQ auditados vêm dos procedimentos de avaliação da conformidade do:</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">TG Act apenas</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\"><a class=\"hot\" data-refs=\"tg-mdr\">TG(MD)R</a> Schedule 3</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">ARTG Handbook</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">TGA Audit Manual</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">13. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Requisitos específicos de país que não têm correspondência direta na <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> são tratados no relatório:</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Com graduação normal</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em seção própria do formulário, sem graduação</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Como observação verbal</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Fora do relatório</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">14. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A não conformidade é definida como:</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Risco ao paciente</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não atendimento de um requisito</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Desvio de meta interna</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Falha de inspeção</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">15. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Os três elementos obrigatórios do achado são:</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Causa, efeito e prazo</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Requisito, falha de conformidade e evidência objetiva</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Cláusula, nota e prazo</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Processo, tarefa e auditor</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">16. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A nota inicial de uma cláusula de impacto direto é:</span></p><p class=\"opt\" data-q=\"cad:q16\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1</span></p><p class=\"opt\" data-q=\"cad:q16\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2</span></p><p class=\"opt\" data-q=\"cad:q16\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3</span></p><p class=\"opt\" data-q=\"cad:q16\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">5</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">17. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">As duas exceções de faixa na classificação de impacto são:</span></p><p class=\"opt\" data-q=\"cad:q17\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">7.5 e 8.4</span></p><p class=\"opt\" data-q=\"cad:q17\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4.2.3 como direta e 8.2.4 como indireta</span></p><p class=\"opt\" data-q=\"cad:q17\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4.1 e 8.5</span></p><p class=\"opt\" data-q=\"cad:q17\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">6.2 e 7.6</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">18. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O escalonador de ausência exige:</span></p><p class=\"opt\" data-q=\"cad:q18\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Procedimento incompleto</span></p><p class=\"opt\" data-q=\"cad:q18\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Requisito não documentado e também não implementado</span></p><p class=\"opt\" data-q=\"cad:q18\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Reclamação do cliente</span></p><p class=\"opt\" data-q=\"cad:q18\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Produto reprovado em inspeção</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">19. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A repetição soma um ponto quando a não conformidade foi identificada:</span></p><p class=\"opt\" data-q=\"cad:q19\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Duas vezes na mesma auditoria</span></p><p class=\"opt\" data-q=\"cad:q19\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Na mesma subcláusula, em uma das duas auditorias anteriores do SGQ</span></p><p class=\"opt\" data-q=\"cad:q19\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em qualquer cláusula do mesmo capítulo</span></p><p class=\"opt\" data-q=\"cad:q19\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Há mais de cinco anos</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">20. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A liberação de dispositivo não conforme não escala a nota quando:</span></p><p class=\"opt\" data-q=\"cad:q20\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O cliente não reclamou</span></p><p class=\"opt\" data-q=\"cad:q20\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Houve concessão com justificativa técnica adequada</span></p><p class=\"opt\" data-q=\"cad:q20\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O lote foi pequeno</span></p><p class=\"opt\" data-q=\"cad:q20\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A empresa corrigiu depois</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">21. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A nota máxima reportada é:</span></p><p class=\"opt\" data-q=\"cad:q21\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3</span></p><p class=\"opt\" data-q=\"cad:q21\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4</span></p><p class=\"opt\" data-q=\"cad:q21\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">5</span></p><p class=\"opt\" data-q=\"cad:q21\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">6</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">22. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A nota de um achado pode ser alterada:</span></p><p class=\"opt\" data-q=\"cad:q22\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Pela correção do fabricante</span></p><p class=\"opt\" data-q=\"cad:q22\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas por processo documentado de apelação</span></p><p class=\"opt\" data-q=\"cad:q22\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Por acordo no encerramento</span></p><p class=\"opt\" data-q=\"cad:q22\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Pelo auditor líder, a qualquer tempo</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">23. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Quando mais de uma cláusula se aplica, o auditor escolhe:</span></p><p class=\"opt\" data-q=\"cad:q23\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A mais genérica</span></p><p class=\"opt\" data-q=\"cad:q23\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A que resulta na maior graduação, preferindo o requisito de implementação</span></p><p class=\"opt\" data-q=\"cad:q23\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A que o auditado aceitar</span></p><p class=\"opt\" data-q=\"cad:q23\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A primeira do capítulo</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">24. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">No MDSAP existe nota geral da auditoria?</span></p><p class=\"opt\" data-q=\"cad:q24\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim, pela média</span></p><p class=\"opt\" data-q=\"cad:q24\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim, pela maior nota</span></p><p class=\"opt\" data-q=\"cad:q24\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não, a graduação é por achado</span></p><p class=\"opt\" data-q=\"cad:q24\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim, somente na recertificação</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">25. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O ciclo de auditoria do MDSAP tem:</span></p><p class=\"opt\" data-q=\"cad:q25\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Um ano</span></p><p class=\"opt\" data-q=\"cad:q25\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Dois anos</span></p><p class=\"opt\" data-q=\"cad:q25\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Três anos</span></p><p class=\"opt\" data-q=\"cad:q25\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quatro anos</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">26. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O total de tarefas do processo de auditoria é:</span></p><p class=\"opt\" data-q=\"cad:q26\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">70</span></p><p class=\"opt\" data-q=\"cad:q26\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">80</span></p><p class=\"opt\" data-q=\"cad:q26\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">90</span></p><p class=\"opt\" data-q=\"cad:q26\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">100</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">27. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O acréscimo de tempo da auditoria inicial é de:</span></p><p class=\"opt\" data-q=\"cad:q27\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">10%</span></p><p class=\"opt\" data-q=\"cad:q27\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">15%</span></p><p class=\"opt\" data-q=\"cad:q27\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">25%</span></p><p class=\"opt\" data-q=\"cad:q27\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">30%</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">28. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A redução de tempo de Produção e Controle de Serviço, quando cabível, é de no máximo:</span></p><p class=\"opt\" data-q=\"cad:q28\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">10%</span></p><p class=\"opt\" data-q=\"cad:q28\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">20%</span></p><p class=\"opt\" data-q=\"cad:q28\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">30%</span></p><p class=\"opt\" data-q=\"cad:q28\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">50%</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">29. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A redução por porte da organização exige:</span></p><p class=\"opt\" data-q=\"cad:q29\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas o número de empregados</span></p><p class=\"opt\" data-q=\"cad:q29\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Dois critérios</span></p><p class=\"opt\" data-q=\"cad:q29\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Três critérios atendidos ao mesmo tempo</span></p><p class=\"opt\" data-q=\"cad:q29\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Pedido do cliente</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">30. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Em auditoria de múltiplos locais:</span></p><p class=\"opt\" data-q=\"cad:q30\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Todos os locais podem ser amostrados</span></p><p class=\"opt\" data-q=\"cad:q30\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Locais de projeto e de fabricação não podem ser amostrados</span></p><p class=\"opt\" data-q=\"cad:q30\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas a sede é auditada</span></p><p class=\"opt\" data-q=\"cad:q30\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O tempo é o do maior local</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">31. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O Estágio 2 da auditoria inicial é realizado:</span></p><p class=\"opt\" data-q=\"cad:q31\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em uma amostra de locais</span></p><p class=\"opt\" data-q=\"cad:q31\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em todos os locais que constarão do certificado</span></p><p class=\"opt\" data-q=\"cad:q31\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente na sede</span></p><p class=\"opt\" data-q=\"cad:q31\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Remotamente</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">32. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Se a primeira vigilância incluiu Projeto e Desenvolvimento, a segunda deve incluir:</span></p><p class=\"opt\" data-q=\"cad:q32\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Gestão</span></p><p class=\"opt\" data-q=\"cad:q32\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Produção e Controle de Serviço</span></p><p class=\"opt\" data-q=\"cad:q32\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Compras</span></p><p class=\"opt\" data-q=\"cad:q32\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Nenhum processo específico</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">33. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Entre os itens mínimos de toda vigilância está:</span></p><p class=\"opt\" data-q=\"cad:q33\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Auditar as 90 tarefas</span></p><p class=\"opt\" data-q=\"cad:q33\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O uso de marcas e referências à certificação</span></p><p class=\"opt\" data-q=\"cad:q33\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Auditar todos os locais</span></p><p class=\"opt\" data-q=\"cad:q33\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Refazer o Estágio 1</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">34. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Um dispositivo pode ser excluído do escopo:</span></p><p class=\"opt\" data-q=\"cad:q34\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quando o cliente pede</span></p><p class=\"opt\" data-q=\"cad:q34\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quando atende ao critério de exclusão em todas as jurisdições aplicáveis</span></p><p class=\"opt\" data-q=\"cad:q34\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quando é de baixo risco</span></p><p class=\"opt\" data-q=\"cad:q34\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quando foi auditado no ciclo anterior</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">35. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Para dispositivos GMP-exempt nos Estados Unidos, permanecem aplicáveis:</span></p><p class=\"opt\" data-q=\"cad:q35\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Nenhum requisito do FDA</span></p><p class=\"opt\" data-q=\"cad:q35\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Arquivos de reclamação e registros, além de <a class=\"hot\" data-refs=\"cfr-803\">21 CFR 803</a>, 806 e 807</span></p><p class=\"opt\" data-q=\"cad:q35\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente o <a class=\"hot\" data-refs=\"cfr-820\">21 CFR 820</a></span></p><p class=\"opt\" data-q=\"cad:q35\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas a listagem de dispositivos</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">36. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Processos terceirizados de projeto ou fabricação:</span></p><p class=\"opt\" data-q=\"cad:q36\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Saem do escopo da organização</span></p><p class=\"opt\" data-q=\"cad:q36\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Permanecem sob responsabilidade da organização, que precisa controlá-los</span></p><p class=\"opt\" data-q=\"cad:q36\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Passam a ser do fornecedor</span></p><p class=\"opt\" data-q=\"cad:q36\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Só entram se o fornecedor for auditado</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">37. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A amostragem preferida é:</span></p><p class=\"opt\" data-q=\"cad:q37\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Exclusivamente estatística</span></p><p class=\"opt\" data-q=\"cad:q37\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Por julgamento, usando trilhas de uma tarefa para informar a seleção em outra</span></p><p class=\"opt\" data-q=\"cad:q37\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Aleatória simples</span></p><p class=\"opt\" data-q=\"cad:q37\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Definida pelo auditado</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">38. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Ajustes na sequência de auditoria entre processos:</span></p><p class=\"opt\" data-q=\"cad:q38\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">São proibidos</span></p><p class=\"opt\" data-q=\"cad:q38\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">São permitidos com justificativa e registro no relatório</span></p><p class=\"opt\" data-q=\"cad:q38\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Dependem da autoridade</span></p><p class=\"opt\" data-q=\"cad:q38\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">São livres e não precisam registro</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">39. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O aviso de 5 dias é enviado em até:</span></p><p class=\"opt\" data-q=\"cad:q39\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">5 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q39\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">5 dias úteis</span></p><p class=\"opt\" data-q=\"cad:q39\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">10 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q39\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">15 dias úteis</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">40. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O pacote completo do relatório, quando houve aviso de 5 dias, vai em:</span></p><p class=\"opt\" data-q=\"cad:q40\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">15 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q40\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">30 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q40\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">45 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q40\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">90 dias corridos</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p>", "refs": ["anvisa-legis", "cfr-803", "cfr-806", "cfr-807", "cfr-820", "iso-13485", "mdsap-docs", "pmda", "tg-mdr"]}, /* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; $("#s1").src=ASSETS.mdsap; $("#s2").src=ASSETS.exemplar;
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
</script>
</body>
</html>
