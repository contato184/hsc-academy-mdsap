:root{
  --navy:#001372; --navy-2:#000B4A; --night:#060B2E; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#E0A526; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#001372; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido — HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,19,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.prof .opt{cursor:default}
.navx{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px;line-height:1.6}
footer img{height:18px;display:block;margin:0 auto 8px}
@media (max-width:860px){ .layout{grid-template-columns:1fr} .toc{position:static;max-height:none} .page{padding:20px 16px} .hero h1{font-size:25px} }
.footbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body{padding-bottom:44px}
.wm{bottom:7px!important}

t\" data-refs=\"mdsap-docs\">MDSAP AU P0027.007</a>, gatilhos e prazos; <a class=\"hot\" data-refs=\"iso-17021\">ISO/IEC 17021-1:2015</a>, 9.7</span></p>", "refs": ["iso-17021", "mdsap-docs"]}, {"id": "s10", "kicker": "AVALIAÇÃO FINAL", "title": "Avaliação objetiva: 15 questões", "ex": null, "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">AVALIAÇÃO FINAL</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#001372\">Avaliação objetiva: 15 questões</span></p><p style=\"margin-top:0.0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Individual, 15 minutos, sem consulta. Marque uma alternativa por questão.</span></p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">1. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A definição de não conformidade usada pelo sistema de graduação é:</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Desvio de procedimento interno</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não atendimento de um requisito</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Risco ao paciente</span></p><p class=\"opt\" data-q=\"cad:q1\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Falha detectada em inspeção</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">2. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Para o <a class=\"hot\" data-refs=\"mdsap-docs\">P0037</a>, a evidência objetiva do achado precisa identificar:</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Apenas o documento</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O quê, quem, quando e onde, com extensão justificada</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A causa raiz</span></p><p class=\"opt\" data-q=\"cad:q2\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A ação corretiva proposta</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">3. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Quando mais de uma cláusula da <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> se aplica ao achado, o auditor escolhe:</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A mais genérica</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A que resulta na maior graduação e o requisito de implementação</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A que o fabricante aceitar</span></p><p class=\"opt\" data-q=\"cad:q3\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A primeira do capítulo</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">4. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">No passo 1 da graduação, a nota inicial de impacto indireto é:</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">0</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">2</span></p><p class=\"opt\" data-q=\"cad:q4\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">3</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">5. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">As cláusulas de impacto direto são:</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4.1 a 6.3</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">6.4 a 8.5, exceto 8.2.4, mais a 4.2.3</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente 7.5</span></p><p class=\"opt\" data-q=\"cad:q5\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Todas as do capítulo 8</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">6. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A cláusula 4.2.3, arquivo do dispositivo médico, é classificada como:</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Impacto indireto</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Impacto direto</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não graduada</span></p><p class=\"opt\" data-q=\"cad:q6\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Depende do país</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">7. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A repetição soma um ponto quando a não conformidade:</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Aparece duas vezes na mesma auditoria</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Foi identificada em uma das duas auditorias anteriores, na mesma subcláusula</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Já foi corrigida antes</span></p><p class=\"opt\" data-q=\"cad:q7\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Atinge mais de um produto</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">8. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O escalonador de ausência se aplica quando:</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O procedimento está incompleto</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Falta documentar e falta implementar o requisito</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O registro está ilegível</span></p><p class=\"opt\" data-q=\"cad:q8\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O procedimento não foi revisado no prazo</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">9. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A liberação de dispositivo não conforme não escala a nota quando:</span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O produto foi recolhido depois</span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A liberação ocorreu sob concessão com justificativa técnica adequada</span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O cliente não reclamou</span></p><p class=\"opt\" data-q=\"cad:q9\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O lote era pequeno</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">10. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">A nota final de uma não conformidade pode variar de:</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">0 a 4</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1 a 5</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1 a 6</span></p><p class=\"opt\" data-q=\"cad:q10\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">1 a 10</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">11. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Depois que o fabricante corrige o problema, a nota do achado:</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Cai um ponto</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">É removida</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não se altera, salvo por processo de apelação</span></p><p class=\"opt\" data-q=\"cad:q11\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Passa a ser decidida pela autoridade</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">12. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">As não conformidades contra requisitos específicos de país, sem cláusula da <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a>:</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Recebem nota 1</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Recebem nota 3</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não são graduadas e entram na seção de requisitos de país</span></p><p class=\"opt\" data-q=\"cad:q12\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não são comunicadas</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">13. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O formulário de graduação e troca de informações:</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Traz a nota geral da auditoria</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não traz nota cumulativa da auditoria</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Substitui o relatório de auditoria</span></p><p class=\"opt\" data-q=\"cad:q13\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">É interno da organização auditora</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">14. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">O aviso de 5 dias é disparado, entre outros casos, por:</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Qualquer não conformidade grau 3</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Uma não conformidade grau 5 ou mais de duas grau 4</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Atraso do fabricante na resposta</span></p><p class=\"opt\" data-q=\"cad:q14\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Pedido do fabricante</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p><p style=\"margin-top:0.0px;margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:14.3px;color:#001372\">15. </span><span style=\"font-weight:700;font-size:14.3px;color:#001372\">Quando houve aviso de 5 dias, o pacote completo de relatório é entregue em:</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"a\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">30 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"b\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">45 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"c\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">90 dias corridos</span></p><p class=\"opt\" data-q=\"cad:q15\" data-o=\"d\" style=\"margin-top:0.0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">10 dias úteis</span></p><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:6.8px;font-size:8.2px\">&nbsp;</p>", "refs": ["iso-13485", "mdsap-docs"]}];

/* HSC Academy · núcleo comum (proteção, referências, exercícios) */
const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>
      <div id="refList"></div><div class="acts"><button class="btn" data-close>Fechar</button></div></div></div>
      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||p.get("cuser_name")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} · ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} · ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; $("#s1").src=ASSETS.mdsap; $("#s2").src=ASSETS.exemplar;
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
